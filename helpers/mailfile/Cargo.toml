[package]
name = "mailfile"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ammonia = "=4.2.0"
base64 = "=0.23.1"
cfb = "=0.15.0"
compressed-rtf = "=1.0.1"
encoding_rs = "=0.8.41"
mail-builder = { version = "=1.0.0", default-features = false }
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
uuid = "=1.26.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
