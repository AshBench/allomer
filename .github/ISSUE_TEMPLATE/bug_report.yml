name: Bug report
description: Report a problem in the app or command-line tool.
title: "[Bug] "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before filing
      options:
        - label: I searched for an existing report of this problem.
          required: true
        - label: I can reproduce this with the current version or current source.
          required: true
  - type: input
    attributes:
      label: Allomer version or commit
      placeholder: Version, commit, or build date
    validations:
      required: true
  - type: input
    attributes:
      label: Mac and macOS version
      placeholder: Mac model and macOS version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: State what happened and what you expected.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Choose …
        3. Observe …
    validations:
      required: true
  - type: textarea
    attributes:
      label: Extra details
      description: Add relevant logs or settings. Remove private paths and file contents.
    validations:
      required: false
